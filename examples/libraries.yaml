# 相对路径以本配置所在目录为基准；资料只读，不复制进doc-library。
# 从仓库根运行：build/doc-library --config examples/libraries.yaml --mode search --query LRSheetCompose
cache_dir: ../build/doc-cache
cache_mode: readwrite
search:
  match: all
  limit: 8
  snippet_chars: 1200
  max_chars: 8000
frequency:
  enabled: true
  max_entries: 256
  text_chars: 2048
sources:
  - id: yantrace
    root: ../../yantrace
    include:
      - doc/yantrace.pdf
      - doc/src/**/*.tex
      - docs/**/*.md
      - tex/**/*.sty
      - tex/**/*.cls
    exclude:
      - '**/.build/**'
      - '**/build/**'
      - '**/归档/**'
    extensions: [.md, .tex, .sty, .cls, .pdf]
    weight: 1
  - id: examzh
    root: ../../yantrace/vendor/exam-zh-0.3.6/exam-zh
    include:
      - README.md
      - doc/exam-zh-doc.pdf
      - doc/**/*.tex
      - examples/**/*.tex
    extensions: [.md, .tex, .pdf]
    weight: 1
  - id: luadraw
    root: ../../compare-figure/vendor/luadraw-3.7/luadraw
    include:
      - README.md
      - doc/*.pdf
      - doc/src/**/*.tex
      - files/**/*.lua
      - examples/**/*.lua
      - examples/**/*.tex
    extensions: [.md, .tex, .lua, .pdf]
    weight: 1
